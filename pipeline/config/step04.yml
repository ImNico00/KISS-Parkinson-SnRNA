step04:
  min_cells_pseudobulk: 20
  target_sum_norm: 10000.0
  stratification_mode: "proxy"
  kiss1r_gene: "KISS1R"
  gnaq_gene: "GNAQ"
  proxy_genes: [
    "GNA11", "GRK2", "ARRB1", "ARRB2",
    "PLCB1", "PLCB2", "PLCB3", "PLCB4",
    "ITPR1", "ITPR2", "ITPR3",
    "PRKCA", "PRKCB",
    "TRPC1", "TRPC3", "TRPC4", "TRPC5", "TRPC6", "TRPC7",
    "MAPK1", "MAPK3", "MAPK14"
  ]
  min_active_proxies: 20
  stability_proxy_thresholds: [18, 19, 20, 21]
  dorothea_levels: ["A", "B", "C"]
  # Pre-specified primary consensus (use ["viper", "gsea", "mlm"], ["ulm", "mlm", "viper"], or ["all"])
  primary_consensus_methods: ["viper", "gsea", "mlm"]
  decoupler_methods: ["ulm", "waggr", "viper", "aucell", "gsea", "gsva", "mlm", "zscore"]
  run_stability_audit: true
  min_combo_size: 3
  tmin_targets: 15
  fdr_threshold: 0.05
  nominal_p_threshold: 0.05
  diff_threshold: 0.25